name: Build and Deploy to Pages

on:
  push:
    branches: [gh-pages, main, master, develop]
  pull_request:
    branches: [gh-pages, main, master, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Validate public build configuration
        run: node scripts/check-pages-environment.cjs

      - name: Cache node_modules with v4
        uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check security regressions
        run: node --test tests/security-regressions.test.cjs

      - name: Build
        run: npm run build:github

      - name: Check exported website
        run: node scripts/check-pages-artifact.cjs out

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'
